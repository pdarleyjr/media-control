name: release-gate

on:
  push:
    branches:
      - repair/enterprise-media-control
      - main
      - 'release/**'
  pull_request:
    branches:
      - repair/enterprise-media-control
      - main

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan repository and history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-build:
    name: test:release + container
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            appliance/electron/package-lock.json

      - name: Install and audit podium Electron shell
        working-directory: appliance/electron
        run: |
          npm ci
          npm exec -- install-electron
          npm audit --audit-level=high
          test -x node_modules/electron/dist/electron
          node --check main.js
          node --check preload.js

      - name: Install server dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3

      - name: Install Playwright (enterprise fixture harness)
        working-directory: server/e2e/enterprise-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Playwright (real-app / FF / SW harness)
        working-directory: server/e2e/real-app
        run: |
          npm ci
          # The browser-console acceptance suite (playwright.browser-console.config.js)
          # runs projects in BOTH chromium AND firefox, so both browsers must be
          # present on the clean runner. Chromium alone made the Firefox project
          # fail with "Executable doesn't exist at .../firefox/firefox".
          # WebKit is required for the mobile-defect acceptance suite (iPhone emulation).
          npx playwright install --with-deps chromium firefox webkit

      - name: Verify release gate scripts exist
        run: |
          node -e "const p=require('./package.json'); for (const k of ['test:node','test:p3','test:ui-contract','test:playwright','test:real-app','test:feature-flag-rollback','test:service-worker','test:browser-console','test:release']) { if (!p.scripts[k]) { console.error('missing script', k); process.exit(1);} } console.log('scripts ok')"
          test -f ../appliance/p3/room-agent/cache-server.test.js
          test -f ../appliance/p3/room-agent/common-loader.test.js
          test -f ../appliance/p3/room-agent/lan-health-test.test.js
          test -f e2e/real-app/feature-flag-rollback.spec.js
          test -f e2e/real-app/service-worker.spec.js
          test -f e2e/real-app/real-app.spec.js
          test -f e2e/real-app/browser-console.spec.js
          test -f e2e/real-app/playwright.browser-console.config.js
          test -f e2e/real-app/mobile-defect.spec.js
          test -f e2e/real-app/playwright.mobile.config.js

      - name: Run mobile acceptance tests (Chromium + WebKit)
        working-directory: server/e2e/real-app
        run: npx playwright test --config=playwright.mobile.config.js
        env:
          CI: true

      - name: Upload mobile failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-failure-evidence-${{ github.sha }}
          path: |
            server/e2e/real-app/test-results/
            server/e2e/real-app/playwright-report-mobile/
          if-no-files-found: error
          retention-days: 14

      - name: Run release test gate
        run: npm run test:release
        env:
          CI: true

      - name: Build production container
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          GIT_COMMIT="$(git rev-parse HEAD)"
          GIT_TREE="$(git rev-parse 'HEAD^{tree}')"
          GIT_BRANCH="${GITHUB_REF_NAME:-unknown}"
          BUILD_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TAG="media-control:ci-${GIT_COMMIT}"
          docker build \
            --build-arg "CACHEBUST=${GIT_COMMIT}" \
            --build-arg "GIT_COMMIT=${GIT_COMMIT}" \
            --build-arg "GIT_TREE=${GIT_TREE}" \
            --build-arg "GIT_BRANCH=${GIT_BRANCH}" \
            --build-arg "BUILD_TIMESTAMP=${BUILD_TS}" \
            --build-arg "BUILD_ID=gha-${GITHUB_RUN_ID:-local}" \
            --build-arg "IMAGE_TAG=${TAG}" \
            -t "${TAG}" \
            .
          mkdir -p image-provenance
          IMAGE_ID="$(docker image inspect "${TAG}" --format '{{.Id}}')"
          OCI_REVISION="$(docker image inspect "${TAG}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          OCI_SOURCE="$(docker image inspect "${TAG}" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')"
          test "${OCI_REVISION}" = "${GIT_COMMIT}"
          test "${OCI_SOURCE}" = "https://github.com/pdarleyjr/media-control"

          docker run -d --rm --name media-control-provenance-test \
            -p 127.0.0.1:3001:3001 "${TAG}"
          trap 'docker rm -f media-control-provenance-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3001/api/system/version > image-provenance/api-version.json && break
            sleep 1
          done
          test -s image-provenance/api-version.json
          node -e '
            const fs = require("fs");
            const version = JSON.parse(fs.readFileSync("image-provenance/api-version.json", "utf8"));
            const expectedCommit = process.argv[1];
            const expectedTree = process.argv[2];
            if (version.git_commit !== expectedCommit) throw new Error(`commit mismatch: ${version.git_commit}`);
            if (version.git_tree !== expectedTree) throw new Error(`tree mismatch: ${version.git_tree}`);
            if (version.provenance?.mode !== "embedded") throw new Error("embedded provenance is not active");
            if (version.provenance?.mutable_environment_ignored !== true) throw new Error("runtime environment is not ignored");
          ' "${GIT_COMMIT}" "${GIT_TREE}"
          docker rm -f media-control-provenance-test
          trap - EXIT

          node -e '
            const fs = require("fs");
            const payload = {
              git_commit: process.argv[1],
              git_tree: process.argv[2],
              image_id: process.argv[3],
              image_tag: process.argv[4],
              oci_revision: process.argv[5],
              oci_source: process.argv[6],
              github_run_id: process.env.GITHUB_RUN_ID,
            };
            fs.writeFileSync("image-provenance/image.json", `${JSON.stringify(payload, null, 2)}\n`);
          ' "${GIT_COMMIT}" "${GIT_TREE}" "${IMAGE_ID}" "${TAG}" "${OCI_REVISION}" "${OCI_SOURCE}"

      - name: Upload image provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-provenance-${{ github.sha }}
          path: image-provenance/
          if-no-files-found: error
          retention-days: 30
