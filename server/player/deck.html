<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Control - Presentation</title>
<!-- Served under /player/* which is CSP- and Cloudflare-Access-bypassed, so
     inline CSS/JS is intentional here (this page loads unattended on displays).
     The versioned deck and server-compiled render plan are injected by the server, so no
     authenticated API call is needed. -->
<style>
  :root{
    --slate:#0F172A; --slate2:#1E293B; --ink:#F8FAFC; --muted:#CBD5E1;
    --red:#DC2626; --redrim:rgba(220,38,38,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 120% at 80% 10%, #1E293B 0%, #0F172A 60%, #0B1220 100%);
    color:var(--ink); font-family:'Plus Jakarta Sans','Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
    overflow:hidden; cursor:default;
  }
  #stage{position:fixed;inset:0}
  #stage.v2-stage{inset:auto;left:50%;top:50%;transform-origin:center center;background:#031A33;overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .35s ease;display:none}
  .slide.show{opacity:1;display:block}
  .deck-body{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 8vw;z-index:2}
  /* No fixed max-width: the column fills the padded stage on any display, from a
     1080p TV to the full ultra-wide wall canvas (font sizes are already vw-based). */
  .deck-col{width:100%;max-width:none;display:flex;flex-direction:column}
  /* Image layers: behind (z1) and in front of (z3) the text body (z2). */
  .imglayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .imglayer.back{z-index:1}
  .imglayer.front{z-index:3}
  .imglayer img{position:absolute;display:block}
  .kicker{display:inline-flex;align-items:center;gap:10px;color:var(--red);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:1.1vw;margin-bottom:2.2vh}
  .kicker::before{content:'';width:clamp(24px,3.5vw,48px);height:clamp(2px,0.4vw,6px);border-radius:max(2px,0.3vmin);background:var(--red)}
  h1{font-size:5.2vw;line-height:1.05;font-weight:800;letter-spacing:-.02em}
  h2{font-size:3.6vw;line-height:1.1;font-weight:800;letter-spacing:-.01em;margin-bottom:3vh}
  .subtitle{font-size:2vw;color:var(--muted);margin-top:2.5vh;font-weight:500}
  ul{list-style:none;display:flex;flex-direction:column;gap:1.8vh;margin-top:1vh}
  li{display:flex;gap:1.2vw;align-items:flex-start;font-size:2.1vw;line-height:1.3}
  li::before{content:'';flex:0 0 auto;width:.9vw;height:.9vw;border-radius:50%;background:var(--red);margin-top:1.1vh}
  .body{font-size:2vw;line-height:1.5;color:#E2E8F0;max-width:70%}
  .section{align-items:center;text-align:center}
  .section .bar{width:clamp(60px,9vw,150px);height:clamp(4px,0.5vw,8px);border-radius:max(3px,0.4vmin);background:var(--red);margin:0 auto 4vh}
  .quote{align-items:center;text-align:center}
  .quote .q{font-size:3.4vw;line-height:1.3;font-style:italic;font-weight:600;max-width:80%}
  .title-slide{align-items:flex-start}
  .brand{position:fixed;top:4vh;left:8vw;display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:1.1vw;letter-spacing:.04em}
  .brand .dot{width:clamp(10px,1.2vw,20px);height:clamp(10px,1.2vw,20px);border-radius:max(3px,0.3vmin);background:var(--red)}
  /* footer / controls */
  #bar{position:fixed;left:0;right:0;bottom:0;height:max(4px,0.4vh);background:rgba(255,255,255,.08)}
  #fill{height:100%;width:0;background:var(--red);transition:width .25s linear}
  #hud{position:fixed;bottom:2.2vh;right:8vw;color:var(--muted);font-size:1vw;font-variant-numeric:tabular-nums;opacity:.7}
  #dots{position:fixed;bottom:2.2vh;left:8vw;display:flex;gap:8px}
  #dots .d{width:clamp(6px,0.8vw,14px);height:clamp(6px,0.8vw,14px);border-radius:50%;background:rgba(255,255,255,.22)}
  #dots .d.on{background:var(--red)}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:1.6vw;color:var(--muted);text-align:center;padding:10vw}
  .v2-object{position:absolute;overflow:hidden}
  .v2-background{background:#031A33}
  .v2-panel{background:#041F39;border:2px solid rgba(11,56,94,.7);border-radius:18px}
  .v2-takeaway{background:#0B385E;border:2px solid rgba(232,179,61,.72);border-radius:18px}
  .v2-text{display:flex;width:100%;height:100%;align-items:center;color:#F7FAFD;font-family:'Noto Sans','Aptos','Arial',sans-serif;white-space:pre-wrap;line-height:1.22;padding:4px 8px}
  .v2-title,.v2-section-title{font-family:'Roboto Condensed','Aptos','Arial',sans-serif;font-weight:700}
  .v2-title{font-size:68px;line-height:1.05}
  .v2-section-title{font-size:92px;line-height:1.02;color:#E8B33D;text-align:center;justify-content:center}
  .v2-subtitle{font-size:38px;color:#F7FAFD}
  .v2-body{font-size:40px;line-height:1.34;align-items:flex-start}
  .v2-bullet{font-size:40px;line-height:1.22}
  .v2-caption,.v2-global{font-size:28px;color:#F7FAFD}
  .v2-media{position:absolute;width:100%;height:100%;object-fit:contain;background:transparent}
  .v2-media.cover{object-fit:cover}
  .v2-link{color:#F7FAFD;text-decoration:none;display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:34px;text-align:center;padding:24px;background:#0B385E}
  .v2-table{width:100%;height:100%;border-collapse:collapse;color:#F7FAFD;font-size:32px;background:#041F39}
  .v2-table td,.v2-table th{border:2px solid #0B385E;padding:10px 14px;vertical-align:top}
  body.v2-player .brand,body.v2-player #dots{display:none}
</style>
</head>
<body>
  <div class="brand"><span class="dot"></span><span>MBFD MEDIA CONTROL</span></div>
  <div id="stage"></div>
  <div id="dots"></div>
  <div id="hud"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="err">This presentation is unavailable.</div>
<script src="/player/device-contract.js"></script>
<script>
(function(){
  var deck = window.__deck;
  var renderPlan = window.__deckRenderPlan;
  var params = new URLSearchParams(location.search || '');
  var previewMode = params.get('preview') === '1';
  var stage = document.getElementById('stage');
  if(!deck || !Array.isArray(deck.slides) || !deck.slides.length){ document.getElementById('err').style.display='flex'; return; }
  document.title = (deck.title||'Presentation') + ' - Media Control';
  var slides = deck.slides;
  var isV2 = deck.version === 'mbfd-deck-v2' && renderPlan && Array.isArray(renderPlan.slides);
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  // Only allow image URLs the server actually serves; never javascript:/data: from
  // user-authored deck JSON. Relative app paths + http(s) only.
  function safeUrl(u){
    u = String(u==null?'':u);
    if(/^\/player\/asset\//.test(u) || /^\/uploads\/content\//.test(u) || /^\/api\/content\//.test(u) || /^https?:\/\//i.test(u)) return u;
    return '';
  }
  function num(v, d){ var n = Number(v); return isFinite(n) ? Math.max(0, Math.min(100, n)) : d; }

  function pxBox(el, box){
    if(!box) return;
    el.style.left=Number(box.x||0)+'px'; el.style.top=Number(box.y||0)+'px';
    el.style.width=Number(box.w||0)+'px'; el.style.height=Number(box.h||0)+'px';
  }
  function v2TextClass(name){
    if(/SECTION_TITLE/.test(name)) return 'v2-section-title';
    if(/(^|_)TITLE$/.test(name)) return 'v2-title';
    if(/SUBTITLE/.test(name)) return 'v2-subtitle';
    if(/BULLET/.test(name)) return 'v2-bullet';
    if(/PARAGRAPH|_BODY|TABLE_TEXT|QUOTE_TEXT/.test(name)) return 'v2-body';
    if(/CAPTION/.test(name)) return 'v2-caption';
    return 'v2-global';
  }
  function safePresentationAsset(value){
    if(value && value.content_id) return '/player/asset/'+encodeURIComponent(String(value.content_id));
    var url=String(value&&value.url||'');
    return /^\/player\/asset\/[A-Za-z0-9_-]+$/.test(url)?url:'';
  }
  function appendV2Value(host,name,value){
    if(value==null||value==='') return;
    if(value&&typeof value==='object'&&!Array.isArray(value)){
      if(value.type==='table'&&Array.isArray(value.rows)){
        var table=document.createElement('table'); table.className='v2-table';
        value.rows.forEach(function(row){var tr=document.createElement('tr');(Array.isArray(row)?row:[row]).forEach(function(cell){var td=document.createElement('td');td.textContent=String(cell==null?'':cell);tr.appendChild(td);});table.appendChild(tr);});
        host.appendChild(table); return;
      }
      var assetUrl=safePresentationAsset(value);
      if(assetUrl&&value.type==='video'){
        var video=document.createElement('video'); video.className='v2-media '+(value.fit==='cover'?'cover':''); video.src=assetUrl; video.preload='metadata'; video.playsInline=true; video.setAttribute('playsinline',''); host.appendChild(video); return;
      }
      if(assetUrl&&value.type==='audio'){
        var audio=document.createElement('audio'); audio.src=assetUrl; audio.preload='metadata'; host.appendChild(audio);
        var audioLabel=document.createElement('div'); audioLabel.className='v2-link'; audioLabel.textContent=value.caption||'Audio'; host.appendChild(audioLabel); return;
      }
      if(assetUrl){var image=document.createElement('img');image.className='v2-media '+(value.fit==='cover'?'cover':'');image.src=assetUrl;image.alt=String(value.caption||'');host.appendChild(image);return;}
      if(value.url&&/^https?:\/\//i.test(String(value.url))){var link=document.createElement('a');link.className='v2-link';link.href=String(value.url);link.rel='noopener noreferrer';link.textContent=value.caption||(/youtu(?:\.be|be\.com)/i.test(value.url)?'YouTube video link':'External media link');host.appendChild(link);return;}
      value=value.caption||('['+String(value.type||'media')+']');
    }
    var text=document.createElement('div'); text.className='v2-text '+v2TextClass(name); text.textContent=String(value); host.appendChild(text);
  }
  function buildV2Slide(planSlide,slideIndex){
    var el=document.createElement('div'); el.className='slide v2-slide';
    var assigned=Object.create(null); (planSlide.slots||[]).forEach(function(slot){assigned[slot.name]=slot;});
    Object.keys(planSlide.objects||{}).forEach(function(name){
      var object=planSlide.objects[name]||{}; var box=object.bbox_px; if(!box) return;
      if(/BACKGROUND$/.test(name)||/PANEL$/.test(name)||/TAKEAWAY_BOX|SLIDE_NUMBER_BLOCK/.test(name)){
        var shape=document.createElement('div');shape.className='v2-object '+(/BACKGROUND$/.test(name)?'v2-background':(/TAKEAWAY_BOX|SLIDE_NUMBER_BLOCK/.test(name)?'v2-takeaway':'v2-panel'));pxBox(shape,box);el.appendChild(shape);
      }
    });
    ['GLOBAL_MBFD_LOGO','GLOBAL_MBFD_WATERMARK'].forEach(function(name){
      var object=planSlide.objects&&planSlide.objects[name];if(!object||!object.bbox_px)return;
      var host=document.createElement('div');host.className='v2-object';pxBox(host,object.bbox_px);
      var image=document.createElement('img');image.className='v2-media';image.alt='';
      image.src='/player/template-asset/'+encodeURIComponent(String(deck.wall_profile||''))+'/'+encodeURIComponent(name);
      host.appendChild(image);el.appendChild(host);
    });
    var globals={GLOBAL_HEADER_MIAMI_BEACH:'MIAMI BEACH',GLOBAL_HEADER_FIRE_DEPARTMENT:'FIRE DEPARTMENT',GLOBAL_FOOTER_MARK:'✦',GLOBAL_COURSE_SECTION:deck.course_section||'COURSE / SECTION',GLOBAL_PRESENTATION_TITLE:deck.title||'',GLOBAL_SLIDE_LABEL:'SLIDE #',GLOBAL_SLIDE_NUMBER:String(slideIndex+1).padStart(2,'0')};
    Object.keys(globals).forEach(function(name){var object=planSlide.objects&&planSlide.objects[name];if(!object||!object.bbox_px||assigned[name])return;var host=document.createElement('div');host.className='v2-object';pxBox(host,object.bbox_px);appendV2Value(host,name,globals[name]);el.appendChild(host);});
    (planSlide.slots||[]).forEach(function(slot){if(!slot.geometry||!slot.geometry.bbox_px)return;var host=document.createElement('div');host.className='v2-object';pxBox(host,slot.geometry.bbox_px);appendV2Value(host,slot.name,slot.value);el.appendChild(host);});
    return el;
  }
  function fitV2Stage(){
    if(!isV2) return;
    var canvas=renderPlan.profile.canvas_px; var scale=Math.min(window.innerWidth/canvas.w,window.innerHeight/canvas.h);
    stage.style.width=canvas.w+'px'; stage.style.height=canvas.h+'px'; stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }

  function buildSlide(s){
    var el = document.createElement('div');
    el.className = 'slide';
    var back = document.createElement('div'); back.className = 'imglayer back';
    var front = document.createElement('div'); front.className = 'imglayer front';
    var body = document.createElement('div'); body.className = 'deck-body';
    var col = document.createElement('div'); col.className = 'deck-col';
    var layout = s.layout||'content';
    var bullets = Array.isArray(s.bullets)?s.bullets:[];
    if(layout==='title'){
      col.classList.add('title-slide');
      col.innerHTML = '<div class="kicker">Media Control Studio</div>'+
        '<h1>'+esc(s.title)+'</h1>'+ (s.subtitle?'<div class="subtitle">'+esc(s.subtitle)+'</div>':'');
    } else if(layout==='section'){
      col.classList.add('section');
      col.innerHTML = '<div class="bar"></div><h1>'+esc(s.title)+'</h1>'+(s.subtitle?'<div class="subtitle">'+esc(s.subtitle)+'</div>':'');
    } else if(layout==='quote'){
      col.classList.add('quote');
      col.innerHTML = '<div class="q">"'+esc(s.body||s.title)+'"</div>'+(s.subtitle?'<div class="subtitle">'+esc(s.subtitle)+'</div>':'');
    } else {
      var inner = '<div class="kicker">'+esc(deck.title||'')+'</div><h2>'+esc(s.title)+'</h2>';
      if(bullets.length){ inner += '<ul>'+bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>'; }
      else if(s.body){ inner += '<div class="body">'+esc(s.body)+'</div>'; }
      col.innerHTML = inner;
    }
    body.appendChild(col);

    // Image overlays (mbfd-deck-v1 slide.images[]). Percentages of the stage,
    // so they map 1:1 onto a 16:9 display. object-fit keeps them undistorted.
    (Array.isArray(s.images)?s.images:[]).forEach(function(im){
      var url = safeUrl(im && im.url);
      if(!url) return;
      var pic = document.createElement('img');
      pic.src = url;
      pic.alt = '';
      var op = (im.opacity!=null && isFinite(Number(im.opacity))) ? Math.max(0, Math.min(1, Number(im.opacity))) : 1;
      var css = 'left:'+num(im.x,0)+'%;top:'+num(im.y,0)+'%;width:'+num(im.w,40)+'%;height:'+num(im.h,40)+'%;'+
        'object-fit:'+(im.fit==='cover'?'cover':'contain')+';opacity:'+op+';';
      if(im.rounded){ css += 'border-radius:1.4vw;'; }
      if(im.shadow){ css += 'filter:drop-shadow(0 1vw 2.4vw rgba(0,0,0,.55));'; }
      pic.style.cssText = css;
      (im.layer==='back'?back:front).appendChild(pic);
    });

    el.appendChild(back);
    el.appendChild(body);
    el.appendChild(front);
    return el;
  }

  if(isV2){document.body.classList.add('v2-player');stage.classList.add('v2-stage');renderPlan.slides.forEach(function(s,i){stage.appendChild(buildV2Slide(s,i));});fitV2Stage();window.addEventListener('resize',fitV2Stage);}
  else { slides.forEach(function(s){ stage.appendChild(buildSlide(s)); }); }
  var els = Array.prototype.slice.call(stage.children);
  var dots = document.getElementById('dots');
  els.forEach(function(_,i){ var d=document.createElement('div'); d.className='d'; dots.appendChild(d); });
  var dotEls = Array.prototype.slice.call(dots.children);
  var hud = document.getElementById('hud');
  var fill = document.getElementById('fill');

  var requestedSlide = parseInt(params.get('slide') || '1', 10) || 1;
  var idx=Math.max(0, Math.min(slides.length-1, requestedSlide-1)), timer=null, t0=0, dur=0, raf=null, paused=previewMode;
  function currentSlide() { return slides[idx] || null; }
  function activeMedia(){return els[idx]&&els[idx].querySelector('video,audio');}
  function slideTitle(slide){
    if(!isV2) return slide&&(slide.title||slide.subtitle||null)||null;
    var plan=renderPlan.slides[idx];var title=(plan&&plan.slots||[]).find(function(slot){return /(^|_)TITLE$|SECTION_TITLE|QUOTE_TEXT/.test(slot.name)&&typeof slot.value==='string';});return title?title.value:null;
  }
  function currentState() {
    var slide = currentSlide();
    var error = document.getElementById('err').style.display === 'flex';
    var media=activeMedia();
    var elapsed = media&&isFinite(media.currentTime)?media.currentTime:Math.max(0, (performance.now() - t0) / 1000);
    var slideDuration = media&&isFinite(media.duration)&&media.duration>0?media.duration:(dur > 0 ? dur / 1000 : (Number(slide && slide.duration_seconds) > 0 ? Number(slide.duration_seconds) : 12));
    return {
      content_id: deck.deck_id || deck.id || null,
      content_instance_id: deck.content_instance_id || deck.deck_id || deck.id || null,
      generation: Number.isFinite(Number(deck.generation)) ? Number(deck.generation) : 1,
      content_type: 'presentation',
      kind: 'presentation',
      title: deck.title || 'Presentation',
      media_title: deck.title || 'Presentation',
      media_type: 'presentation',
      slide_title: slideTitle(slide),
      slide_index: idx + 1,
      slide_total: slides.length,
      total_pages: slides.length,
      current_time: elapsed,
      duration: slideDuration,
      slide_duration: slideDuration,
      paused: !!paused,
      progress: slideDuration > 0 ? Math.max(0, Math.min(1, elapsed / slideDuration)) : 0,
      render_state: error ? 'error' : (paused ? 'paused' : 'playing'),
      status: error ? 'error' : (paused ? 'paused' : 'playing'),
      error_state: error ? 'Deck unavailable.' : null,
      media_state: media ? { type: media.tagName.toLowerCase(), paused: media.paused, current_time: elapsed, duration: slideDuration } : null,
    };
  }
  function publishState(ack) {
    var state = currentState();
    window.__mcTransportState = state;
    if (window.parent && window.parent !== window) {
      var msg = { __mc_transport_state: state };
      if (ack) msg.__mc_transport_ack = ack;
      try { window.parent.postMessage(msg, location.origin); } catch (e) {}
    }
    return state;
  }
  function show(i){
    els.forEach(function(e){var media=e.querySelector&&e.querySelector('video,audio');if(media){try{media.pause();}catch(_){}}});
    idx=(i+els.length)%els.length;
    els.forEach(function(e,k){ e.classList.toggle('show', k===idx); });
    dotEls.forEach(function(d,k){ d.classList.toggle('on', k===idx); });
    hud.textContent=(idx+1)+' / '+els.length;
    schedule();
    publishState();
  }
  function schedule(){
    if(timer) clearTimeout(timer);
    if(raf) cancelAnimationFrame(raf);
    if(paused){ return; }
    var media=activeMedia();
    if(media){
      t0=performance.now();
      try{var playPromise=media.play();if(playPromise&&playPromise.catch)playPromise.catch(function(){});}catch(_){}
      (function mediaTick(){var total=isFinite(media.duration)&&media.duration>0?media.duration:0;fill.style.width=(total?Math.min(100,media.currentTime/total*100):0)+'%';if(!paused&&media===activeMedia())raf=requestAnimationFrame(mediaTick);})();
      if(slides[idx]&&slides[idx].auto_advance_on_media_end===true){
        var advanceFromIdx = idx;
        var advanceDeckId = deck.deck_id || deck.id || null;
        var advanceGen = Number.isFinite(Number(deck.generation)) ? Number(deck.generation) : 1;
        media.onended = function(){
          // Only advance if this media's slide/deck is still the active one. A
          // late 'ended' from a replaced or navigated-away slide must never
          // advance a different (newly loaded) presentation.
          if (idx !== advanceFromIdx) return;
          if ((deck.deck_id || deck.id || null) !== advanceDeckId) return;
          if ((Number.isFinite(Number(deck.generation)) ? Number(deck.generation) : 1) !== advanceGen) return;
          show(idx + 1);
        };
      }else{media.onended=null;}
      return;
    }
    dur = ((Number(slides[idx] && slides[idx].duration_seconds)>0?Number(slides[idx].duration_seconds):12))*1000;
    t0 = performance.now();
    timer = setTimeout(function(){ show(idx+1); }, dur);
    (function tick(){ var p=Math.min(1,(performance.now()-t0)/dur); fill.style.width=(p*100)+'%'; if(p<1&&!paused) raf=requestAnimationFrame(tick); })();
  }
  function next(){ show(idx+1); }
  function prev(){ show(idx-1); }
  function togglePause(){ paused=!paused; var media=activeMedia(); if(paused){ if(timer)clearTimeout(timer); if(raf)cancelAnimationFrame(raf);if(media){try{media.pause();}catch(_){}}} else { schedule(); } publishState(); }

  function unwrapTransportPayload(payload) {
    var current = payload;
    for (var i = 0; i < 4; i++) {
      if (!current || typeof current !== 'object' || Array.isArray(current)) break;
      var nested = current.payload;
      var wrapped = current.action || current.command || current.type;
      if (!wrapped || !nested || typeof nested !== 'object' || Array.isArray(nested)) break;
      current = nested;
    }
    return current && typeof current === 'object' && !Array.isArray(current) ? current : {};
  }

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'){ next(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ prev(); }
    else if(e.key===' '){ e.preventDefault(); togglePause(); }
    else if(e.key==='f'||e.key==='F'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
  });
  document.addEventListener('click', function(){ next(); });

  function normalizeAction(input) {
    if (window.MbfdDeviceContract && typeof window.MbfdDeviceContract.normalizeCommand === 'function') {
      var normalized = window.MbfdDeviceContract.normalizeCommand(input, {
        device_id: 'deck-child',
        target_scope: 'display',
      });
      if (normalized.ok) {
        return {
          action: normalized.value.payload.action,
          payload: normalized.value.payload,
          command_id: normalized.value.command_id,
        };
      }
    }
    var action = '';
    var payload = {};
    var commandId = null;
    if (typeof input === 'string') {
      action = input;
    } else if (input && typeof input === 'object') {
      var rawPayload = input.payload && typeof input.payload === 'object' && !Array.isArray(input.payload) ? input.payload : null;
      action = (rawPayload && (rawPayload.action || rawPayload.command || rawPayload.type)) || input.action || input.command || input.type || '';
      payload = rawPayload && (rawPayload.action || rawPayload.command || rawPayload.type)
        ? unwrapTransportPayload(rawPayload)
        : (rawPayload || input);
      commandId = input.command_id || input.commandId || input.id || null;
    }
    return { action: String(action || '').trim(), payload: payload || {}, command_id: commandId };
  }
  var appliedCommandIds = Object.create(null);
  function goToSlide(value) {
    var parsed = parseInt(value, 10);
    if (!Number.isFinite(parsed)) throw new Error('Missing slide number');
    var zeroBased = parsed > 0 ? parsed - 1 : parsed;
    if (zeroBased < 0 || zeroBased >= els.length) throw new Error('Slide out of range');
    show(zeroBased);
  }
  // Remote transport from the Broadcast Center. The parent player forwards
  // a command envelope ({action, payload, command_id}) as __mc_transport, and
  // the deck replies with __mc_transport_state / __mc_transport_ack.
  function handleAction(input) {
    var cmd = normalizeAction(input);
    var action = cmd.action;
    var ack = { command_id: cmd.command_id || null, action: action || null, ok: true, status: 'acked', type: 'transport' };
    try {
      if (cmd.command_id && appliedCommandIds[cmd.command_id]) {
        ack.idempotent = true;
        ack.state = publishState(ack);
        return ack;
      }
      if (action === 'next' || action === 'next_slide') next();
      else if (action === 'prev' || action === 'previous' || action === 'previous_slide') prev();
      else if (action === 'play_pause' || action === 'toggle_play_pause') togglePause();
      else if (action === 'restart' || action === 'restart_deck' || action === 'reset') show(0);
      else if (action === 'pause' || action === 'pause_deck') { if (!paused) togglePause(); }
      else if (action === 'play' || action === 'resume' || action === 'resume_deck') { if (paused) togglePause(); }
      else if (action === 'go_to_slide' || action === 'slide' || action === 'goto') {
        goToSlide(cmd.payload.page || cmd.payload.slide || cmd.payload.index || cmd.payload.slide_number || cmd.payload.slide_index);
      } else {
        throw new Error('Unsupported action: ' + action);
      }
      if (cmd.command_id) appliedCommandIds[cmd.command_id] = true;
    } catch (err) {
      ack.ok = false;
      ack.status = 'failed';
      ack.error = err && err.message ? err.message : String(err || 'Action failed');
    }
    ack.state = publishState(ack);
    return ack;
  }
  window.handleAction = handleAction;
  window.addEventListener('message', function(e){
    if(!e || e.origin !== location.origin || e.source !== window.parent) return;
    var data = e && e.data;
    if(!data || data.__mc_transport == null) return;
    handleAction(data.__mc_transport);
  });

  show(idx);
  publishState({ action: 'ready', ok: true, status: 'ready' });
})();
</script>
